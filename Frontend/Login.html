<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Choripan Solutions</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Animación para error (vibración) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/80 backdrop-blur-md w-full max-w-md rounded-2xl shadow-xl border border-white/60 overflow-hidden">
        
        <div class="p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-slate-700 mb-2">Bienvenido</h1>
                <p class="text-slate-500 text-sm">Ingresa a la plataforma de gestión</p>
            </div>

            <form id="loginForm" class="space-y-6">
                
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-indigo-300 group-focus-within:text-indigo-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <input
                        type="text"
                        id="rut"
                        required
                        inputmode="numeric"
                        autocomplete="username"
                        class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl leading-5
                            bg-slate-50 placeholder-slate-400
                            focus:outline-none focus:bg-white focus:ring-2
                            focus:ring-indigo-200 focus:border-indigo-400
                            transition-all duration-200 text-slate-700"
                        placeholder="RUT (ej: 11111111)"
                    >
                </div>

                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-indigo-300 group-focus-within:text-indigo-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        required
                        class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 transition-all duration-200 text-slate-700" 
                        placeholder="Contraseña"
                    >
                </div>

                <div id="errorMessage" class="hidden bg-red-50 text-red-500 text-xs py-3 px-4 rounded-lg text-center border border-red-100">
                    Usuario o contraseña incorrectos
                </div>

                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full flex items-center justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-medium text-white bg-indigo-400 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-300 transition-all duration-300 transform hover:-translate-y-0.5"
                >
                    <span id="btnText">Ingresar</span>
                    <svg id="loadingSpinner" class="hidden animate-spin ml-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>
        </div>

        <div class="bg-slate-50 px-8 py-4 border-t border-slate-100 flex justify-center">
            <p class="text-xs text-slate-400">© 2024 Choripan Solutions</p>
        </div>
    </div>

    <script>
        const DEV_MODE = false;

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loadingSpinner = document.getElementById('loadingSpinner');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            setLoading(true);

            const rutRaw = document.getElementById('rut').value;
            const rutClean = parseInt(rutRaw.replace(/[^0-9]/g, ''));
            const password = document.getElementById('password').value;

            if (DEV_MODE) {
                console.warn("LOGIN EN MODO DEV");

                setTimeout(() => {
                    localStorage.setItem('jwt_token', 'DEV_FAKE_TOKEN');
                    localStorage.setItem('user_rut', rutClean || 11111111);
                    localStorage.setItem('user_role', 'ADMIN'); // si lo necesitas

                    window.location.href = 'dashboard.html';
                }, 600);

                return;
            }


            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rut: rutClean, password: password })
                });

                if (!response.ok) {
                    // Si el status es 401, las credenciales están mal
                    if (response.status === 401) {
                        showError("RUT o contraseña incorrectos.");
                    } else {
                        showError("Error en el servidor (" + response.status + ")");
                    }
                    return; // Salimos del try para no intentar procesar el JSON
                }

                const data = await response.json();
                
                // Guardamos el token
                localStorage.setItem('jwt_token', data.token);
                localStorage.setItem('user_rut', rutClean);

                // Lógica para obtener el rol (desde respuesta JSON o decodificando JWT)
                let roleInt = data.rol; 

                // Si el rol no viene explícito en el JSON, intentamos decodificar el token
                if (!roleInt && data.token) {
                    try {
                        const base64Url = data.token.split('.')[1];
                        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                        const payload = JSON.parse(window.atob(base64));
                        roleInt = payload.rol || payload.role; 
                    } catch (e) {
                        console.warn("No se pudo extraer rol del token");
                    }
                }

                // Mapeo de roles (1: ADMIN, 2: INVESTIGADOR, 3: RECLUTADOR, 4: MEDICO)
                const roleMap = { 1: 'ADMIN', 2: 'INVESTIGADOR', 3: 'RECLUTADOR', 4: 'MEDICO' };
                const userRole = roleMap[roleInt] || 'INVITADO';
                
                localStorage.setItem('user_role', userRole);

                window.location.href = 'dashboard.html';

            } catch (error) {
                console.error("Error capturado:", error);
                // Si el backend está apagado o hay error de red, fetch lanza TypeError
                if (error instanceof TypeError) {
                    showError("No se pudo conectar con el servidor. ¿Está el backend encendido?");
                } else {
                    showError("Ocurrió un error inesperado.");
                }
            } finally {
                // ESTO ES LO MÁS IMPORTANTE: 
                // Siempre se ejecuta, fallé o no, quitando el estado "Verificando"
                setLoading(false);
            }
        });

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            loadingSpinner.classList.toggle('hidden', !isLoading);
            btnText.textContent = isLoading ? 'Verificando...' : 'Ingresar';
            submitBtn.style.opacity = isLoading ? '0.7' : '1';
        }

        function showError(msg) {
            if (msg) errorMessage.textContent = msg;
            errorMessage.classList.remove('hidden');
            errorMessage.classList.add('shake');
            setTimeout(() => errorMessage.classList.remove('shake'), 500);
        }

        function hideError() {
            errorMessage.classList.add('hidden');
        }
    </script>
</body>
</html>
