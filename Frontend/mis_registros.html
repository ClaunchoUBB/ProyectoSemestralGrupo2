<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Registros - Choripan Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Scrollbar personalizada */
        .custom-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen flex flex-col">

    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-bold text-slate-700">Historial de Registros</span>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='dashboard.html'" class="text-sm font-medium text-slate-500 hover:text-indigo-600 transition-colors flex items-center bg-white px-4 py-2 rounded-full shadow-sm border border-slate-100">
                        <svg class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                        Volver al Dashboard
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full fade-in">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-indigo-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Total Registrados</p>
                    <h3 class="text-3xl font-bold text-slate-700 mt-1" id="stat-total">0</h3>
                </div>
                <div class="h-12 w-12 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-500">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-rose-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-rose-400 uppercase tracking-wider">Casos (Cáncer)</p>
                    <h3 class="text-3xl font-bold text-slate-700 mt-1" id="stat-casos">0</h3>
                </div>
                <div class="h-12 w-12 bg-rose-50 rounded-full flex items-center justify-center text-rose-500">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-emerald-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Controles (Sanos)</p>
                    <h3 class="text-3xl font-bold text-slate-700 mt-1" id="stat-controles">0</h3>
                </div>
                <div class="h-12 w-12 bg-emerald-50 rounded-full flex items-center justify-center text-emerald-500">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
            </div>
        </div>

        <div class="bg-white/90 backdrop-blur rounded-2xl shadow-xl border border-white/60 overflow-hidden">
            
            <div class="p-6 border-b border-slate-50 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="relative w-full md:w-96">
                    <input type="text" placeholder="Buscar por nombre o ID..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 text-slate-600">
                    <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                </div>
                <div class="flex gap-2">
                    <button class="px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-lg text-sm hover:bg-slate-50 font-medium">Filtrar</button>
                    <button class="px-4 py-2 bg-indigo-50 border border-indigo-100 text-indigo-600 rounded-lg text-sm hover:bg-indigo-100 font-medium">Exportar Vista</button>
                </div>
            </div>

            <div class="overflow-x-auto custom-scroll">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/80 text-slate-500 text-xs uppercase tracking-wider">
                            <th class="p-5 font-bold border-b border-slate-100">Código ID</th>
                            <th class="p-5 font-bold border-b border-slate-100">Fecha Registro</th>
                            <th class="p-5 font-bold border-b border-slate-100">Participante</th>
                            <th class="p-5 font-bold border-b border-slate-100 text-center">Tipo</th>
                            <th class="p-5 font-bold border-b border-slate-100 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-sm text-slate-600 divide-y divide-slate-50">
                        <tr>
                            <td colspan="5" class="p-10 text-center">
                                <div class="flex justify-center items-center space-x-2">
                                    <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce"></div>
                                    <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce delay-100"></div>
                                    <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce delay-200"></div>
                                </div>
                                <p class="text-xs text-slate-400 mt-2">Cargando registros...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="p-4 border-t border-slate-50 bg-slate-50/30 flex justify-between items-center">
                <span class="text-xs text-slate-400">Mostrando <span id="count-display">0</span> registros</span>
                <div class="flex gap-1">
                    <button class="px-3 py-1 rounded bg-white border border-slate-200 text-slate-400 text-xs hover:bg-slate-50 disabled:opacity-50" disabled>Anterior</button>
                    <button class="px-3 py-1 rounded bg-white border border-slate-200 text-slate-600 text-xs hover:bg-slate-50">Siguiente</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', loadRegistros);

        async function loadRegistros() {
            const tableBody = document.getElementById('tableBody');
            
            // Simulación de Fetch al Backend
            // En producción: fetch('/api/participantes/mis-registros', { headers: { Authorization: token } })
            
            setTimeout(() => {
                // DATOS DUMMY (Basados en Participante.java)
                // Grupo 1 = Caso, Grupo 0 = Control
                const mockData = [
                    { codigo: 'C-205', fecha: '2025-12-18', nombre: 'Juan', apellido: 'Pérez', grupo: 1 },
                    { codigo: 'K-104', fecha: '2025-12-17', nombre: 'Maria', apellido: 'Gómez', grupo: 0 },
                    { codigo: 'C-204', fecha: '2025-12-16', nombre: 'Roberto', apellido: 'Díaz', grupo: 1 },
                    { codigo: 'K-103', fecha: '2025-12-15', nombre: 'Luisa', apellido: 'Tapia', grupo: 0 },
                    { codigo: 'K-102', fecha: '2025-12-14', nombre: 'Ana', apellido: 'Silva', grupo: 0 },
                    { codigo: 'C-203', fecha: '2025-12-10', nombre: 'Pedro', apellido: 'Ramirez', grupo: 1 },
                ];

                renderTable(mockData);
                updateStats(mockData);

            }, 800); // Retardo simulado
        }

        function renderTable(data) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = ''; // Limpiar spinner

            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400">No tienes registros aún.</td></tr>`;
                return;
            }

            data.forEach(p => {
                // Determinar Estilos según Grupo (Caso vs Control)
                const isCaso = p.grupo === 1;
                const badgeClass = isCaso 
                    ? 'bg-rose-100 text-rose-600 border-rose-200' 
                    : 'bg-emerald-100 text-emerald-600 border-emerald-200';
                const label = isCaso ? 'Caso' : 'Control';

                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50 transition-colors group cursor-default";
                row.innerHTML = `
                    <td class="p-5 font-mono text-xs font-semibold text-slate-500 group-hover:text-indigo-500 transition-colors">
                        ${p.codigo}
                    </td>
                    <td class="p-5 text-slate-600">
                        ${p.fecha}
                    </td>
                    <td class="p-5">
                        <div class="font-medium text-slate-700">${p.nombre} ${p.apellido}</div>
                    </td>
                    <td class="p-5 text-center">
                        <span class="px-3 py-1 rounded-full text-xs font-bold border ${badgeClass}">
                            ${label}
                        </span>
                    </td>
                    <td class="p-5 text-center">
                        <div class="flex justify-center gap-2 opacity-60 group-hover:opacity-100 transition-opacity">
                            <button class="p-2 bg-white border border-slate-200 rounded-lg hover:border-indigo-300 hover:text-indigo-600 shadow-sm transition-all" title="Ver Detalle">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                            </button>
                            <button class="p-2 bg-white border border-slate-200 rounded-lg hover:border-amber-300 hover:text-amber-600 shadow-sm transition-all" title="Editar">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                            </button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            document.getElementById('count-display').textContent = data.length;
        }

        function updateStats(data) {
            const total = data.length;
            const casos = data.filter(d => d.grupo === 1).length;
            const controles = data.filter(d => d.grupo === 0).length;

            animateValue("stat-total", 0, total, 1000);
            animateValue("stat-casos", 0, casos, 1000);
            animateValue("stat-controles", 0, controles, 1000);
        }

        // Animación de números
        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }
    </script>
</body>
</html>
