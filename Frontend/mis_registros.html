<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Registros - Choripan Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .custom-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>

<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen flex flex-col">

<nav class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
        <span class="text-xl font-bold text-slate-700">Historial de Registros</span>
        <button onclick="window.location.href='dashboard.html'"
            class="text-sm font-medium text-slate-500 hover:text-indigo-600 flex items-center bg-white px-4 py-2 rounded-full shadow-sm border">
            Volver al Dashboard
        </button>
    </div>
</nav>

<main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full fade-in">

    <!-- Estadísticas -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white p-6 rounded-2xl shadow border border-indigo-100">
            <p class="text-xs font-bold text-indigo-400 uppercase">Total</p>
            <h3 id="stat-total" class="text-3xl font-bold text-slate-700">0</h3>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow border border-rose-100">
            <p class="text-xs font-bold text-rose-400 uppercase">Casos</p>
            <h3 id="stat-casos" class="text-3xl font-bold text-slate-700">0</h3>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow border border-emerald-100">
            <p class="text-xs font-bold text-emerald-400 uppercase">Controles</p>
            <h3 id="stat-controles" class="text-3xl font-bold text-slate-700">0</h3>
        </div>
    </div>

    <!-- Tabla -->
    <div class="bg-white rounded-2xl shadow-xl border overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-slate-50 text-xs uppercase text-slate-500">
                <tr>
                    <th class="p-4">Código</th>
                    <th class="p-4">Fecha</th>
                    <th class="p-4">Participante</th>
                    <th class="p-4 text-center">Tipo</th>
                    <th class="p-4 text-center">Acciones</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="5" class="p-8 text-center text-slate-400">
                        Cargando registros...
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="p-4 text-xs text-slate-400">
            Mostrando <span id="count-display">0</span> registros
        </div>
    </div>

</main>

<script>
document.addEventListener('DOMContentLoaded', loadRegistros);

async function loadRegistros() {
    console.log(data);
    const tableBody = document.getElementById('tableBody');

    try {
        const token = localStorage.getItem('jwt_token');

        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        const response = await fetch('http://localhost:8080/api/participantes/mis-registros', {
            headers: {
                'Authorization': 'Bearer ' + token
            }
        });

        if (!response.ok) {
            throw new Error('Error al cargar registros');
        }

        const data = await response.json();

        renderTable(data);
        updateStats(data);

    } catch (err) {
        console.error(err);
        tableBody.innerHTML = `
            <tr>
                <td colspan="5" class="p-8 text-center text-red-400">
                    No se pudieron cargar los registros
                </td>
            </tr>
        `;
    }
}

function renderTable(data) {
    const tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = '';

    if (data.length === 0) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="5" class="p-8 text-center text-slate-400">
                    No tienes registros aún
                </td>
            </tr>
        `;
        return;
    }

    data.forEach(p => {
        const isCaso = p.grupo === 1;
        const badge = isCaso
            ? 'bg-rose-100 text-rose-600'
            : 'bg-emerald-100 text-emerald-600';

        const row = document.createElement('tr');
        row.className = 'hover:bg-slate-50';

        row.innerHTML = `
            <td class="p-4 font-mono text-xs">${p.codigo}</td>
            <td class="p-4">${new Date(p.fechaInclusion).toLocaleDateString()}</td>
            <td class="p-4 font-medium">${p.nombre} ${p.apellido}</td>
            <td class="p-4 text-center">
                <span class="px-3 py-1 rounded-full text-xs font-bold ${badge}">
                    ${isCaso ? 'Caso' : 'Control'}
                </span>
            </td>
            <td class="p-4 text-center">
                <button onclick="verDetalle(${p.id})"
                    class="px-3 py-1 text-xs border rounded hover:bg-indigo-50">
                    Ver
                </button>
            </td>
        `;
        tableBody.appendChild(row);
    });

    document.getElementById('count-display').textContent = data.length;
}

function updateStats(data) {
    document.getElementById('stat-total').textContent = data.length;
    document.getElementById('stat-casos').textContent = data.filter(p => p.grupo === 1).length;
    document.getElementById('stat-controles').textContent = data.filter(p => p.grupo === 0).length;
}

function verDetalle(id) {
    window.location.href = `detalle_participante.html?id=${id}`;
}
</script>

</body>
</html>
